name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # Refresh the TV guide (schedules for the channels in epg/channels.xml) every 6 hours.
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only publish from the repository's default branch (scheduled runs always use it).
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Download fresh schedules on the timer or a manual run. A push only redeploys the app
      # and reuses the guide that's already live, so deploys stay quick.
      - name: Download TV schedules
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git "$RUNNER_TEMP/epg"
          cd "$RUNNER_TEMP/epg"
          npm ci --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/epg/channels.xml" custom.channels.xml
          npm run grab --- --channels=custom.channels.xml --output="$RUNNER_TEMP/xmltv/{site}.xml" \
            --days=2 --delay=2000 --maxConnections=2 --timeout=20000

      - name: Build TV guide files
        continue-on-error: true
        run: node scripts/build-guide.mjs "$RUNNER_TEMP/xmltv" guide --previous "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
